<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220">
  <rect width="720" height="220" fill="white"/>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="40" width="200" height="110" rx="6" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
    <text x="120" y="78" font-size="15" fill="#222">A. Decodable?</text>
    <text x="120" y="102" font-size="12" fill="#444">linear probe answers this</text>
    <text x="120" y="122" font-size="12" fill="#444">by construction</text>

    <rect x="260" y="40" width="200" height="110" rx="6" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
    <text x="360" y="78" font-size="15" fill="#222">B. Causally used?</text>
    <text x="360" y="102" font-size="12" fill="#444">needs an intervention</text>
    <text x="360" y="122" font-size="12" fill="#444">(patch / ablate / clamp)</text>

    <rect x="500" y="40" width="200" height="110" rx="6" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
    <text x="600" y="78" font-size="15" fill="#222">C. Represented simply?</text>
    <text x="600" y="102" font-size="12" fill="#444">direction vs helix</text>
    <text x="600" y="122" font-size="12" fill="#444">vs k-dimensional subspace</text>

    <text x="360" y="185" font-size="13" fill="#333">A positive A does not answer B or C. Most probe confusion is treating it as if it did.</text>
  </g>
</svg>
