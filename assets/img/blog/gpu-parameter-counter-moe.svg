<svg xmlns="http://www.w3.org/2000/svg" width="740" height="280" viewBox="0 0 740 280">
  <rect width="740" height="280" fill="white"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="175" y="28" text-anchor="middle" font-size="14" fill="#222">Dense block</text>
    <text x="555" y="28" text-anchor="middle" font-size="14" fill="#222">MoE block</text>

    <rect x="70" y="48" width="210" height="36" rx="4" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
    <text x="175" y="71" text-anchor="middle" font-size="13" fill="#222">attention (always on)</text>
    <rect x="70" y="108" width="210" height="52" rx="4" fill="#d9e8d3" stroke="#222" stroke-width="1.4"/>
    <text x="175" y="131" text-anchor="middle" font-size="13" fill="#222">one FFN</text>
    <text x="175" y="149" text-anchor="middle" font-size="11" fill="#444">all weights run</text>
    <text x="175" y="188" text-anchor="middle" font-size="12" fill="#333">N_active = N_total</text>
    <text x="175" y="208" text-anchor="middle" font-size="12" fill="#333">FLOPs and memory agree</text>

    <rect x="450" y="48" width="210" height="36" rx="4" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
    <text x="555" y="71" text-anchor="middle" font-size="13" fill="#222">attention (always on)</text>
    <rect x="450" y="98" width="210" height="22" rx="3" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
    <text x="555" y="114" text-anchor="middle" font-size="12" fill="#222">router picks k of E</text>

    <rect x="450" y="132" width="46" height="36" rx="3" fill="#d9e8d3" stroke="#222" stroke-width="1.3"/>
    <text x="473" y="154" text-anchor="middle" font-size="11" fill="#222">e1</text>
    <rect x="504" y="132" width="46" height="36" rx="3" fill="#d9e8d3" stroke="#222" stroke-width="1.3"/>
    <text x="527" y="154" text-anchor="middle" font-size="11" fill="#222">e2</text>
    <rect x="558" y="132" width="46" height="36" rx="3" fill="#f4f4f4" stroke="#888" stroke-width="1.1"/>
    <text x="581" y="154" text-anchor="middle" font-size="11" fill="#888">e3</text>
    <rect x="612" y="132" width="48" height="36" rx="3" fill="#f4f4f4" stroke="#888" stroke-width="1.1"/>
    <text x="636" y="154" text-anchor="middle" font-size="11" fill="#888">...</text>

    <text x="555" y="188" text-anchor="middle" font-size="12" fill="#333">N_active &lt;&lt; N_total</text>
    <text x="555" y="208" text-anchor="middle" font-size="12" fill="#333">6ND sees green. Gossip sees all.</text>

    <text x="370" y="252" text-anchor="middle" font-size="12" fill="#333">Attention is dense either way. Sparsity lives in the FFN.</text>
