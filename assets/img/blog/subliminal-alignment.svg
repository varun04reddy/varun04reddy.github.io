<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400">
  <rect width="520" height="400" fill="white"/>
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f4e79"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222">
    <text x="260" y="28" text-anchor="middle" font-size="14">student update is the projection of the teacher update onto nabla G</text>
    <line x1="60" y1="330" x2="480" y2="330" stroke="#ccc" stroke-width="1"/>
    <line x1="60" y1="330" x2="60" y2="50" stroke="#ccc" stroke-width="1"/>
    <line x1="60" y1="330" x2="420" y2="330" stroke="#666" stroke-width="2" marker-end="url(#arrowGray)"/>
    <text x="390" y="352" font-size="14" fill="#666">nabla G at init</text>
    <line x1="60" y1="330" x2="330" y2="120" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="342" y="118" font-size="15" fill="#1f4e79">teacher step</text>
    <line x1="60" y1="330" x2="330" y2="330" stroke="#b45309" stroke-width="3" marker-end="url(#arrowOrange)"/>
    <text x="165" y="352" font-size="15" fill="#b45309">student step</text>
    <line x1="330" y1="120" x2="330" y2="330" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
    <rect x="324" y="324" width="12" height="12" fill="none" stroke="#999"/>
  </g>
</svg>
